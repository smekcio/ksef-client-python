name: KSeF TEST scenarios

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ksef-test-scenarios.yml'
      - '.github/workflows/required-test-e2e.yml'
      - 'tests/test_e2e_rev2_tokens.py'
      - 'tests/test_e2e_personal_grants.py'
      - 'tests/test_e2e_certificate_rotation.py'
      - 'tests/test_e2e_offline_queue.py'
      - 'tests/test_e2e_export_archive.py'
      - 'tools/verify_e2e_results.py'
      - 'src/ksef_client/clients/auth.py'
      - 'src/ksef_client/clients/permissions.py'
      - 'src/ksef_client/permission_checks.py'
      - 'src/ksef_client/clients/tokens.py'
      - 'src/ksef_client/certificate_rotation.py'
      - 'src/ksef_client/invoice_export_sync.py'
      - 'src/ksef_client/offline_invoices.py'
      - 'specs/ksef-openapi.snapshot.json'
  workflow_dispatch:
    inputs:
      suite:
        description: Scenarios to run on the current main wheel
        type: choice
        options: [extended, operations, token-rev2]
        default: extended

permissions:
  contents: read

jobs:
  scenarios:
    name: Additional installed-wheel scenarios on TEST
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/required-test-e2e.yml
    with:
      ref: ${{ github.sha }}
      test-suite: ${{ inputs.suite || 'extended' }}
    secrets:
      KSEF_TEST_TOKEN: ${{ secrets.KSEF_TEST_TOKEN }}
      KSEF_TEST_CONTEXT_TYPE: ${{ secrets.KSEF_TEST_CONTEXT_TYPE }}
      KSEF_TEST_CONTEXT_VALUE: ${{ secrets.KSEF_TEST_CONTEXT_VALUE }}
      KSEF_TEST_XADES_CERT_CRT: ${{ secrets.KSEF_TEST_XADES_CERT_CRT }}
      KSEF_TEST_XADES_CERT_CRT_B64: ${{ secrets.KSEF_TEST_XADES_CERT_CRT_B64 }}
      KSEF_TEST_XADES_PRIVATE_KEY_PEM: ${{ secrets.KSEF_TEST_XADES_PRIVATE_KEY_PEM }}
      KSEF_TEST_XADES_PRIVATE_KEY_PEM_B64: ${{ secrets.KSEF_TEST_XADES_PRIVATE_KEY_PEM_B64 }}
      KSEF_TEST_XADES_PRIVATE_KEY_PASSWORD: ${{ secrets.KSEF_TEST_XADES_PRIVATE_KEY_PASSWORD }}
