name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to test and publish (for example v0.20.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          from tools.release_artifacts import TAG
          tag = os.environ["RELEASE_TAG"]
          if not TAG.fullmatch(tag):
              raise SystemExit("An existing version tag is required")
          sha = subprocess.check_output(["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"], text=True).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if head != sha or tag.removeprefix("v") != version:
              raise SystemExit("Tag, commit and package version must agree")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={sha}\ntag={tag}\n")
          PY

  checks:
    needs: resolve
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - python: "3.14-dev"
            experimental: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt build twine
      - name: Unit and contract tests
        if: matrix.python != '3.12'
        run: python -m pytest
      - name: Coverage gate
        if: matrix.python == '3.12'
        run: python -m pytest --cov=ksef_client --cov-fail-under=100 --cov-report=term-missing
      - name: Lint, typing, generated files and packaging
        if: matrix.python == '3.12'
        run: |
          python tools/lint.py --strict
          python tools/check_coverage.py --openapi specs/ksef-openapi.snapshot.json --src src/ksef_client/clients
          python tools/check_cli_packaging.py

  build:
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Build and record immutable distributions
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python -m build
          python -m twine check dist/*
          python -m tools.release_artifacts record dist --sha "$RELEASE_SHA" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  e2e:
    needs: [resolve, build]
    uses: ./.github/workflows/required-test-e2e.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      artifact-name: release-dist
    secrets: inherit

  publish:
    needs: [resolve, checks, build, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-dist
          path: dist
      - name: Verify tested artifacts and prepare publication
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          python -m tools.release_artifacts verify dist --sha "$RELEASE_SHA"
          mkdir publish-dist
          cp dist/*.whl dist/*.tar.gz publish-dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: publish-dist/
