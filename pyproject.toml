[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ksef-client"
version = "0.21.0"
description = "Typed sync/async Python SDK and CLI for Poland's KSeF e-invoicing API v2"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Mateusz Smektała (smekcio)", email = "mateusz@smkc.dev"}]
keywords = [
  "ksef",
  "krajowy-system-e-faktur",
  "e-invoicing",
  "e-invoice",
  "poland",
  "sdk",
  "cli",
  "async",
  "fa3",
  "xades",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]

dependencies = [
  "httpx>=0.28.1",
  "cryptography>=50.0.0",
  "typing-extensions>=4.5.0",
  # Security floors for dependencies already pulled in by httpx.
  "anyio>=4.14.2",
  "certifi>=2026.10.19",
  "idna>=3.15",
]

[project.optional-dependencies]
xml = [
  "lxml>=5.0.0",
  "xmlsec>=1.3.13",
]
fa3 = [
  "lxml>=5.0.0",
]
qr = [
  "qrcode[pil]>=7.4.2",
  "pillow>=10.0.0",
]
cli = [
  "typer>=0.12.0",
  "rich>=13.7.0,<14",
  "keyring>=25.7.0",
  "jaraco.context>=6.1.0",
]

[project.urls]
Repository = "https://github.com/smekcio/ksef-client-python"
Documentation = "https://github.com/smekcio/ksef-client-python/blob/main/docs/README.md"
Issues = "https://github.com/smekcio/ksef-client-python/issues"
Changelog = "https://github.com/smekcio/ksef-client-python/blob/main/CHANGELOG.md"

[project.scripts]
ksef = "ksef_client.cli.bootstrap:app_entrypoint"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ksef_client = ["py.typed", "*.pyi", "documents/fa3/schemas/*.xsd", "documents/fa3/schemas/*.md"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ksef_client"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["qrcode", "qrcode.*", "PIL", "PIL.*", "xmlsec", "lxml", "lxml.*"]
ignore_missing_imports = true
